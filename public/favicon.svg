<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blinxDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0B0B0D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="15" fill="url(#blinxDark)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  
  <!-- "b" Character (White) -->
  <text x="10" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Syne', 'Inter', sans-serif" font-weight="900" font-size="36" letter-spacing="-2.5" fill="#FFFFFF">b</text>
  
  <!-- "x" Character (Electric Red) -->
  <text x="30" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Syne', 'Inter', sans-serif" font-weight="900" font-size="36" letter-spacing="-2.5" fill="#FF3C5A">x</text>
  
  <!-- Voltage Yellow Pill Underscore -->
  <rect x="49" y="39" width="9" height="4.5" rx="2.25" fill="#FFD600" filter="url(#glow)"/>
</svg>
